[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — a local-first personal AI assistant for Windows 11 with voice control and a team of background AI agents."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Gabe de Guzman", email = "gabedeguzman99@gmail.com" }]

dependencies = [
    # --- Backend / web ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- AI ---
    "anthropic>=0.39.0",
    "ollama>=0.3.3",
    # --- Memory / data ---
    "aiosqlite>=0.20.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.3.0",
    # --- Voice pipeline ---
    "sounddevice>=0.5.1",
    "faster-whisper>=1.1.0",
    "openwakeword>=0.6.0",
    "elevenlabs>=1.50.0",
    # --- Integrations ---
    "slack-bolt>=1.21.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.1",
    # --- Tools ---
    "duckduckgo-search>=6.3.0",
    "playwright>=1.48.0",
    "RestrictedPython>=7.4",
    # --- Security / config ---
    "keyring>=25.5.0",
    # --- Logging ---
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# openwakeword declares tflite-runtime as a Linux-only dep, but tflite-runtime
# has no Python 3.12 wheels. On Windows we use the ONNX inference path instead.
# This override restricts the dep to Linux + Python < 3.12 so uv sync succeeds.
override-dependencies = [
    "tflite-runtime>=0.1.0 ; sys_platform == 'linux' and python_version < '3.12'",
]
